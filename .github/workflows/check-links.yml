name: Check reference freshness and link liveness

on:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "skills/**/references/**"
      - "skills/**/SKILL.md"
      - "README.md"
      - "README.en.md"
      - ".briefs/freshness_policy.md"

jobs:
  link-and-freshness:
    name: Verify IEEE URLs + freshness stamps
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Collect URLs from references and SKILL.md
        run: |
          python - <<'PY'
          import re, pathlib, json
          root = pathlib.Path(".")
          url_re = re.compile(r"https?://[^\s)>\"']+")
          urls = []
          for p in root.rglob("references/*.url.txt"):
              text = p.read_text(encoding="utf-8", errors="ignore")
              for m in url_re.findall(text):
                  urls.append({"file": str(p), "url": m.rstrip(".,;:")})
          for p in list(root.rglob("skills/*/SKILL.md")) + list(root.rglob("skills/*/README.md")):
              text = p.read_text(encoding="utf-8", errors="ignore")
              for m in url_re.findall(text):
                  urls.append({"file": str(p), "url": m.rstrip(".,;:)")})
          for p in [root / "README.md", root / "README.en.md", root / "CHANGELOG.md"]:
              if p.exists():
                  for m in url_re.findall(p.read_text(encoding="utf-8", errors="ignore")):
                      urls.append({"file": str(p), "url": m.rstrip(".,;:)")})
          pathlib.Path("urls.json").write_text(json.dumps(urls, indent=2))
          print(f"Collected {len(urls)} URLs")
          PY

      - name: HEAD-check each URL (warn on non-2xx)
        run: |
          python - <<'PY'
          import json, requests
          urls = json.loads(open("urls.json").read())
          dead = []
          for entry in urls:
              try:
                  r = requests.head(entry["url"], timeout=15, allow_redirects=True)
                  if r.status_code >= 400:
                      dead.append({**entry, "status": r.status_code})
              except Exception as e:
                  dead.append({**entry, "status": f"error: {e}"})
          if dead:
              print("::warning ::Dead or unreachable URLs:")
              for d in dead:
                  print(f"  {d['file']}: {d['url']} -> {d['status']}")
              # Don't fail the build on URL errors; IEEE servers occasionally hiccup.
              # Instead, we write an artifact and open issue tracker handles it.
          open("dead_links.json", "w").write(json.dumps(dead, indent=2))
          print(f"Total checked: {len(urls)}; problematic: {len(dead)}")
          PY

      - name: Parse Verified: dates from .url.txt and flag stale
        run: |
          python - <<'PY'
          import re, pathlib, datetime, json
          today = datetime.date.today()
          stale90 = []
          stale365_csv = []
          date_re = re.compile(r"Verified:\s*(\d{4}-\d{2}-\d{2})")
          # .url.txt files
          for p in pathlib.Path(".").rglob("references/*.url.txt"):
              text = p.read_text(encoding="utf-8", errors="ignore")
              m = date_re.search(text)
              if not m:
                  stale90.append({"file": str(p), "reason": "missing Verified: stamp"})
                  continue
              d = datetime.date.fromisoformat(m.group(1))
              age = (today - d).days
              if age > 180:
                  stale90.append({"file": str(p), "reason": f"verified {age} days ago"})
          # CSV files (journal-matrix, conference-matrix)
          csv_date_re = re.compile(r"#\s*Verified\s*(\d{4}-\d{2}-\d{2})")
          for p in pathlib.Path(".").rglob("*.csv"):
              for i, line in enumerate(p.read_text(encoding="utf-8", errors="ignore").splitlines(), 1):
                  if line.strip().startswith("#") or not line.strip():
                      continue
                  m = csv_date_re.search(line)
                  if not m:
                      stale365_csv.append({"file": str(p), "line": i, "reason": "no Verified stamp"})
                      continue
                  d = datetime.date.fromisoformat(m.group(1))
                  age = (today - d).days
                  if age > 365:
                      stale365_csv.append({"file": str(p), "line": i, "reason": f"verified {age} days ago"})
          if stale90:
              print("::warning ::Stale URL stamps (>180 days):")
              for s in stale90:
                  print(f"  {s['file']}: {s['reason']}")
          if stale365_csv:
              print("::error ::Stale CSV rows (>365 days; IEEE policy data should be refreshed annually):")
              for s in stale365_csv:
                  print(f"  {s['file']}:{s.get('line','-')}: {s['reason']}")
          open("staleness.json", "w").write(json.dumps({"url_stale": stale90, "csv_stale": stale365_csv}, indent=2))
          # Fail only on CSV-level staleness, since IEEE venue data has hard real-world consequences
          import sys
          sys.exit(1 if stale365_csv else 0)
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-and-freshness-report
          path: |
            urls.json
            dead_links.json
            staleness.json
          retention-days: 30
